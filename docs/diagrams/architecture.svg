<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="Flagship Feature Flags Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111a34"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <style>
      .t { font: 700 20px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .s { font: 400 12px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .zone { fill: #131c36; stroke: #293b66; stroke-width: 1.5; rx: 14; }
      .zl { font: 700 11px 'Inter', 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.08em; fill: #38bdf8; text-transform: uppercase; }
      .box { fill: #1b284c; stroke: #3b82f6; stroke-width: 1.3; rx: 10; }
      .box-db { fill: #132c37; stroke: #10b981; stroke-width: 1.4; rx: 10; }
      .box-warn { fill: #252042; stroke: #f59e0b; stroke-width: 1.3; rx: 10; }
      .bt { font: 600 13px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f1f5f9; }
      .bs { font: 400 11px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .e { stroke: #38bdf8; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .ed { stroke: #f59e0b; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1120" height="600" fill="url(#bg)"/>
  <text x="34" y="40" class="t">Flagship &#8212; Feature Flag Control Plane &amp; Zero-RTT Local SDK Architecture</text>
  <text x="34" y="60" class="s">NestJS + Prisma/Postgres Config &amp; Audit &#183; Redis Compiled Environment Snapshots &#183; Sticky 60-Bit SHA-1 Rollouts</text>

  <!-- Plane 1: Control Plane -->
  <rect x="34" y="84" width="1052" height="150" class="zone"/>
  <text x="50" y="106" class="zl">1. Dashboard &amp; Control Plane API (:3000 / :4000)</text>
  <rect x="52" y="122" width="320" height="92" class="box"/>
  <text x="68" y="144" class="bt">Next.js Ops Console (:3000)</text>
  <text x="68" y="162" class="bs">Kill switches &#183; rule builder &#183; targets</text>
  <text x="68" y="179" class="bs">JSON diff Audit Log &#183; Live Demo poll</text>
  <text x="68" y="196" class="bs">Pure-JS SHA-1 browser parity evaluator</text>

  <rect x="400" y="122" width="336" height="92" class="box"/>
  <text x="416" y="144" class="bt">NestJS Control &amp; SDK API (:4000)</text>
  <text x="416" y="162" class="bs">FlagsService validates &amp; bumps version</text>
  <text x="416" y="179" class="bs">DatasetService compiles full flag map</text>
  <text x="416" y="196" class="bs">ADMIN_API_KEY + SDK key guards &#183; /metrics</text>

  <rect x="764" y="122" width="304" height="92" class="box-db"/>
  <text x="780" y="144" class="bt">PostgreSQL (Prisma) &amp; Redis</text>
  <text x="780" y="162" class="bs">Postgres: Project &#183; Env &#183; FlagConfig</text>
  <text x="780" y="179" class="bs">Append-only AuditLog (before/after)</text>
  <text x="780" y="196" class="bs">Redis: compiled ClientDataset per env</text>

  <!-- Plane 2: Local SDK Evaluation -->
  <rect x="34" y="262" width="1052" height="176" class="zone"/>
  <text x="50" y="284" class="zl">2. Edge / Application SDK (@flagship/sdk &#8212; Local Zero-Network Reads)</text>
  <rect x="52" y="302" width="320" height="114" class="box-warn"/>
  <text x="68" y="324" class="bt">Polling Client (client.ts)</text>
  <text x="68" y="344" class="bs">&#8226; Non-overlapping sequential poll</text>
  <text x="68" y="362" class="bs">&#8226; Holds in-memory ClientDataset copy</text>
  <text x="68" y="380" class="bs">&#8226; Survives API downtime (maxStaleness)</text>
  <text x="68" y="398" class="bs">&#8226; boolVariation() = 0 network RTT</text>

  <rect x="400" y="302" width="336" height="114" class="box-db"/>
  <text x="416" y="324" class="bt">Pure Decision Pipeline (engine.ts)</text>
  <text x="416" y="344" class="bs">1. Prerequisites (with cycle guard)</text>
  <text x="416" y="362" class="bs">2. Kill switch (!flag.on -&gt; offVariation)</text>
  <text x="416" y="380" class="bs">3. Exact targets -&gt; 4. AND Rules (first)</text>
  <text x="416" y="398" class="bs">5. Fallthrough (% rollout or fixed var)</text>

  <rect x="764" y="302" width="304" height="114" class="box"/>
  <text x="780" y="324" class="bt">60-Bit Sticky Hash (hash.ts)</text>
  <text x="780" y="344" class="bs">hex15 = sha1(flag.salt.userKey)[0:15]</text>
  <text x="780" y="362" class="bs">point = hex15 / 0xFFFFFFFFFFFFFFF</text>
  <text x="780" y="380" class="bs">Includes user iff point &lt; pct / 100</text>
  <text x="780" y="398" class="bs">10% -&gt; 20% strictly additive (0 churn)</text>

  <!-- Plane 3: Telemetry &amp; Parity -->
  <rect x="34" y="466" width="1052" height="106" class="zone"/>
  <text x="50" y="488" class="zl">3. Verification, Prometheus Observability &amp; Browser Engine Parity</text>
  <rect x="52" y="502" width="500" height="52" class="box"/>
  <text x="68" y="523" class="bt">Prometheus Metrics (:4000/metrics + Grafana)</text>
  <text x="68" y="540" class="bs">flagship_kills_total &#183; flagship_dataset_fetches_total &#183; flagship_evaluations_total</text>

  <rect x="580" y="502" width="488" height="52" class="box"/>
  <text x="596" y="523" class="bt">Cross-Engine Test Verification</text>
  <text x="596" y="540" class="bs">20k-key uniformity + 5k-key 10%-&gt;20% monotonicity + browser SHA-1 parity</text>

  <!-- Edges -->
  <path d="M 372 168 L 400 168" class="e"/>
  <path d="M 736 168 L 764 168" class="e"/>
  <path d="M 500 214 L 212 302" class="ed"/>
  <path d="M 372 359 L 400 359" class="e"/>
  <path d="M 736 359 L 764 359" class="e"/>
  <path d="M 568 214 L 302 502" class="e"/>
  <path d="M 568 416 L 824 502" class="e"/>
</svg>
