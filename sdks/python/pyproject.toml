[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flagship-sdk"
version = "0.1.0"
description = "Python SDK for the Flagship feature-flag platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["flagship"]

[tool.pytest.ini_options]
testpaths = ["tests"]
