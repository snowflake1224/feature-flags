name: SDK Release

# Publishes a versioned @flagship/sdk to npm when a tag like sdk-v1.2.3 is pushed.
on:
  push:
    tags:
      - "sdk-v*"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install
      - run: npm run build --workspace @flagship/sdk
      - run: npm run test --workspace @flagship/sdk
      # Derive the package version from the git tag (sdk-v1.2.3 -> 1.2.3).
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#sdk-v}"
          npm version "$VERSION" --no-git-tag-version --workspace @flagship/sdk
      - run: npm publish --workspace @flagship/sdk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
        working-directory: sdks/python
      - run: twine upload dist/*
        working-directory: sdks/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
